<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Camera</title>
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0;
      min-height: 100vh;
      background: #111;
      color: #eee;
      font: 16px/1.4 system-ui, sans-serif;
    }
    main {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding: 16px;
      box-sizing: border-box;
    }
    form, .bar {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
      justify-content: center;
    }
    input, button, select {
      font: inherit;
      padding: 8px 12px;
      border-radius: 6px;
      border: 1px solid #444;
      background: #1c1c1c;
      color: inherit;
    }
    button { cursor: pointer; }
    .error { color: #f88; margin: 0; }
    canvas#frame {
      max-width: 100%;
      max-height: calc(100vh - 200px);
      background: #000;
      width: auto;
      height: auto;
    }
    .status { color: #aaa; margin: 0; }
    .controls {
      display: grid;
      gap: 8px 12px;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      max-width: 420px;
      width: 100%;
      font-size: 14px;
    }
    .controls input[type="range"] { width: 100%; }
    .controls label { color: #bbb; }
  </style>
</head>
<body>
<main>
  {{if .LoggedIn}}
  <canvas id="frame" width="1024" height="768"></canvas>
  <p class="status" id="status">Connecting…</p>
  <p class="bar">
    <button type="button" id="audioStart">Enable audio</button>
    <label><input type="checkbox" id="audioMute"> Mute</label>
    <span class="status" id="audioStatus">Audio off</span>
  </p>
  <details open>
    <summary>Camera tuning</summary>
    <div class="controls" id="controls">
      <label for="quality">JPEG quality</label>
      <input type="range" id="quality" min="10" max="30" value="26">
      <span id="qualityVal">26</span>
      <label for="antibanding">Anti-banding</label>
      <select id="antibanding">
        <option value="0">Off</option>
        <option value="50" selected>50 Hz</option>
        <option value="60">60 Hz</option>
      </select>
      <span></span>
      <label for="denoise">Denoise</label>
      <input type="range" id="denoise" min="0" max="8" value="3">
      <span id="denoiseVal">3</span>
      <label for="lenc">Lens correction</label>
      <select id="lenc">
        <option value="0">Off</option>
        <option value="1" selected>On</option>
      </select>
      <span></span>
      <label for="sharpness">Sharpness</label>
      <input type="range" id="sharpness" min="-3" max="3" value="-2">
      <span id="sharpnessVal">-2</span>
      <label for="vflip">Vertical flip</label>
      <input type="checkbox" id="vflip">
      <span></span>
      <label for="hmirror">Horizontal mirror</label>
      <input type="checkbox" id="hmirror">
      <span></span>
    </div>
  </details>
  <form method="post" action="/logout" class="bar">
    <button type="submit">Log out</button>
  </form>
  <script>
    const canvas = document.getElementById("frame");
    const ctx = canvas.getContext("2d", { alpha: false });
    const status = document.getElementById("status");
    let watchWs;
    let latestJpeg = null;
    let painting = false;
    let frames = 0;
    let fpsSince = performance.now();

    function setFpsLabel(prefix) {
      const elapsed = (performance.now() - fpsSince) / 1000;
      if (elapsed < 0.5) return;
      const fps = (frames / elapsed).toFixed(1);
      frames = 0;
      fpsSince = performance.now();
      status.textContent = prefix + " · " + fps + " fps";
    }

    function paintLoop() {
      requestAnimationFrame(paintLoop);
      if (painting || !latestJpeg) return;
      const data = latestJpeg;
      latestJpeg = null;
      painting = true;
      createImageBitmap(new Blob([data], { type: "image/jpeg" }))
        .then((bmp) => {
          if (canvas.width !== bmp.width || canvas.height !== bmp.height) {
            canvas.width = bmp.width;
            canvas.height = bmp.height;
          }
          ctx.drawImage(bmp, 0, 0);
          bmp.close();
          frames++;
          setFpsLabel("Live");
        })
        .catch(() => {})
        .finally(() => {
          painting = false;
        });
    }

    function connectWatch() {
      if (watchWs) {
        watchWs.onclose = null;
        watchWs.close();
      }
      const scheme = location.protocol === "https:" ? "wss:" : "ws:";
      watchWs = new WebSocket(scheme + "//" + location.host + "/watch");
      watchWs.binaryType = "arraybuffer";
      watchWs.onopen = () => {
        status.textContent = "Live";
        fpsSince = performance.now();
        frames = 0;
      };
      watchWs.onclose = () => {
        status.textContent = "Reconnecting…";
        setTimeout(connectWatch, 1000);
      };
      watchWs.onerror = () => watchWs.close();
      watchWs.onmessage = (ev) => {
        if (ev.data instanceof ArrayBuffer) latestJpeg = ev.data;
      };
    }
    paintLoop();
    connectWatch();

    const audioStart = document.getElementById("audioStart");
    const audioMute = document.getElementById("audioMute");
    const audioStatus = document.getElementById("audioStatus");
    let audioCtx;
    let audioGain;
    let audioWorklet;
    let listenWs;
    let listenReconnectTimer;
    let audioPackets = 0;
    const workletURL = URL.createObjectURL(new Blob([`
      class PCMPlayer extends AudioWorkletProcessor {
        constructor() {
          super();
          this.inputRate = 16000;
          this.ring = new Float32Array(16000);
          this.write = 0;
          this.readPos = 0;
          this.count = 0;
          this.frac = 0;
          this.lastOut = 0;
          this.minBuffer = 2400;
          this.playing = false;
          this.port.onmessage = (ev) => {
            const buf = ev.data;
            if (!(buf instanceof ArrayBuffer) || buf.byteLength < 6) return;
            const view = new DataView(buf);
            if (view.getUint8(0) !== 0xa1) return;
            const rate = view.getUint16(2, true);
            if (rate > 0) this.inputRate = rate;
            const pcmBytes = view.getUint16(4, true);
            if (pcmBytes < 2 || 6 + pcmBytes > buf.byteLength) return;
            const samples = new Int16Array(buf, 6, pcmBytes >> 1);
            const need = samples.length;
            if (this.count + need > this.ring.length) {
              const drop = Math.max(need, this.ring.length >> 2);
              this.readPos = (this.readPos + drop) % this.ring.length;
              this.count = Math.max(0, this.count - drop);
              this.playing = false;
            }
            for (let i = 0; i < samples.length; i++) {
              this.ring[this.write] = samples[i] / 32768;
              this.write = (this.write + 1) % this.ring.length;
              this.count++;
            }
          };
        }
        process(inputs, outputs) {
          const out = outputs[0][0];
          if (!out) return true;
          const step = this.inputRate / sampleRate;
          for (let i = 0; i < out.length; i++) {
            if (!this.playing) {
              if (this.count < this.minBuffer) {
                out[i] = 0;
                continue;
              }
              this.playing = true;
            }
            if (this.count <= 1) {
              out[i] = this.lastOut * 0.995;
              this.lastOut = out[i];
              continue;
            }
            const i0 = this.readPos;
            const i1 = (this.readPos + 1) % this.ring.length;
            const s0 = this.ring[i0];
            const s1 = this.ring[i1];
            out[i] = s0 + (s1 - s0) * this.frac;
            this.lastOut = out[i];
            this.frac += step;
            while (this.frac >= 1 && this.count > 1) {
              this.frac -= 1;
              this.readPos = (this.readPos + 1) % this.ring.length;
              this.count--;
            }
          }
          return true;
        }
      }
      registerProcessor("pcm-player", PCMPlayer);
    `], { type: "application/javascript" }));

    async function startAudio() {
      if (audioCtx) return;
      audioCtx = new AudioContext();
      await audioCtx.audioWorklet.addModule(workletURL);
      audioWorklet = new AudioWorkletNode(audioCtx, "pcm-player", {
        outputChannelCount: [1],
      });
      audioGain = audioCtx.createGain();
      audioWorklet.connect(audioGain);
      audioGain.connect(audioCtx.destination);
      audioGain.gain.value = audioMute.checked ? 0 : 1;
      await audioCtx.resume();
      connectListen();
      audioStart.disabled = true;
      audioStatus.textContent = "Audio connecting…";
    }

    function connectListen() {
      if (listenReconnectTimer) {
        clearTimeout(listenReconnectTimer);
        listenReconnectTimer = null;
      }
      if (listenWs) {
        listenWs.onclose = null;
        listenWs.close();
      }
      const scheme = location.protocol === "https:" ? "wss:" : "ws:";
      listenWs = new WebSocket(scheme + "//" + location.host + "/listen");
      listenWs.binaryType = "arraybuffer";
      listenWs.onopen = () => {
        audioPackets = 0;
        audioStatus.textContent = audioMute.checked ? "Audio muted" : "Audio live";
      };
      listenWs.onclose = () => {
        audioStatus.textContent = "Audio reconnecting…";
        listenReconnectTimer = setTimeout(connectListen, 1000);
      };
      listenWs.onerror = () => listenWs.close();
      listenWs.onmessage = (ev) => {
        if (!audioWorklet || !(ev.data instanceof ArrayBuffer)) return;
        audioWorklet.port.postMessage(ev.data, [ev.data]);
        audioPackets++;
        if (audioPackets % 50 === 0 && audioCtx) {
          audioStatus.textContent = (audioMute.checked ? "Audio muted · " : "Audio live · ")
            + audioPackets + " pkts";
        }
      };
    }

    audioStart.addEventListener("click", () => {
      startAudio().catch((e) => {
        console.warn("audio start failed", e);
        audioStatus.textContent = "Audio failed (try Chrome/Edge)";
        audioStart.disabled = false;
      });
    });
    audioMute.addEventListener("change", () => {
      if (audioGain) audioGain.gain.value = audioMute.checked ? 0 : 1;
      if (audioCtx) {
        audioStatus.textContent = audioMute.checked ? "Audio muted" : "Audio live";
      }
    });

    const quality = document.getElementById("quality");
    const qualityVal = document.getElementById("qualityVal");
    const denoise = document.getElementById("denoise");
    const denoiseVal = document.getElementById("denoiseVal");
    const sharpness = document.getElementById("sharpness");
    const sharpnessVal = document.getElementById("sharpnessVal");
    const antibanding = document.getElementById("antibanding");
    const lenc = document.getElementById("lenc");
    const vflip = document.getElementById("vflip");
    const hmirror = document.getElementById("hmirror");

    let pushTimer;
    function schedulePush() {
      clearTimeout(pushTimer);
      pushTimer = setTimeout(pushSettings, 350);
    }

    function currentPatch() {
      return {
        quality: Number(quality.value),
        antibanding: Number(antibanding.value),
        denoise: Number(denoise.value),
        lenc: Number(lenc.value),
        sharpness: Number(sharpness.value),
        vflip: vflip.checked ? 1 : 0,
        hmirror: hmirror.checked ? 1 : 0,
      };
    }

    async function pushSettings() {
      try {
        await fetch("/camera/settings", {
          method: "PATCH",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(currentPatch()),
        });
      } catch (e) {
        console.warn("settings push failed", e);
      }
    }

    function bindRange(input, label) {
      input.addEventListener("input", () => {
        label.textContent = input.value;
        schedulePush();
      });
    }
    bindRange(quality, qualityVal);
    bindRange(denoise, denoiseVal);
    bindRange(sharpness, sharpnessVal);
    antibanding.addEventListener("change", schedulePush);
    lenc.addEventListener("change", schedulePush);
    vflip.addEventListener("change", schedulePush);
    hmirror.addEventListener("change", schedulePush);

    fetch("/camera/settings")
      .then((r) => (r.ok ? r.json() : null))
      .then((s) => {
        if (!s) return;
        if (s.quality != null) {
          quality.value = s.quality;
          qualityVal.textContent = s.quality;
        }
        if (s.antibanding != null) antibanding.value = String(s.antibanding);
        if (s.denoise != null) {
          denoise.value = s.denoise;
          denoiseVal.textContent = s.denoise;
        }
        if (s.lenc != null) lenc.value = String(s.lenc);
        if (s.sharpness != null) {
          sharpness.value = s.sharpness;
          sharpnessVal.textContent = s.sharpness;
        }
        if (s.vflip != null) vflip.checked = s.vflip !== 0;
        if (s.hmirror != null) hmirror.checked = s.hmirror !== 0;
      })
      .catch(() => {});
  </script>
  {{else}}
  <h1>Camera</h1>
  {{if .Error}}<p class="error">{{.Error}}</p>{{end}}
  <form method="post" action="/login">
    <input type="password" name="password" autocomplete="current-password" required autofocus>
    <button type="submit">Log in</button>
  </form>
  {{end}}
</main>
</body>
</html>
